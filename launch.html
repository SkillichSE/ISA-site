<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch — ISA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css?v=6">
  <link rel="stylesheet" href="launches.css?v=2">
  <link rel="stylesheet" href="news.css">
  <link rel="stylesheet" href="launch.css?v=1">
  <link rel="icon" type="image/png" href="ISSSSSSSAAAA.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="markdown.js"></script>
</head>
<body>
  <div id="nav-placeholder"></div>

  <!-- Loading state -->
  <div class="launch-state" id="launch-loading">
    <div class="container">
      <div class="launch-spinner"></div>
      <p>Loading launch…</p>
    </div>
  </div>

  <!-- Not found state -->
  <div class="launch-state" id="launch-notfound" style="display:none">
    <div class="container">
      <p class="eyebrow">LAUNCH CALENDAR</p>
      <h1>Launch not found.</h1>
      <p>This launch may have been removed, or the link is incorrect.</p>
      <a href="launches.html" class="btn-outline">← Back to launches</a>
    </div>
  </div>

  <!-- Launch detail -->
  <div id="launch-detail" style="display:none">
    <div class="launch-hero" id="launch-hero">
      <img class="launch-hero-bg-img" id="launch-hero-img" alt="">
      <div class="launch-hero-overlay"></div>
      <div class="container launch-hero-inner">
        <div class="launch-meta" id="launch-detail-meta"></div>
        <h1 id="launch-detail-title"></h1>
        <div class="launch-hero-sub">
          <span id="launch-detail-datebig"></span>
          <span id="launch-detail-time"></span>
          <span class="launch-tags" id="launch-detail-tags"></span>
        </div>
      </div>
    </div>

    <section class="section-launch-detail">
      <div class="container launch-detail-grid">
        <div class="launch-detail-main">
          <div class="news-body-text" id="launch-detail-body"></div>
        </div>

        <aside class="launch-detail-side">
          <a href="launchshare/index.html" class="btn-white launch-ls-cta" id="launch-ls-cta" style="display:none">Book this Launchshare slot →</a>
        </aside>
      </div>
    </section>
  </div>

  <div id="footer-placeholder"></div>

  <script src="shared.js?v=2"></script>
  <script>
    const SB_URL = 'https://fqvghuvmgswegirgitom.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxdmdodXZtZ3N3ZWdpcmdpdG9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTI4MTAsImV4cCI6MjA5NjY4ODgxMH0.7tKrak3ANnnhp4pISK2ythPdCt557vMACUhpQsqWn0s';

    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Branch badges are colored automatically — same branch name always
    // gets the same color, picked deterministically from a fixed palette
    // (a simple string hash % palette length), so no one has to assign
    // colors by hand when a new branch shows up.
    const BRANCH_PALETTE = [
      { bg: 'rgba(91,110,245,0.14)',  fg: '#5b6ef5' },  // blue
      { bg: 'rgba(45,212,191,0.14)',  fg: '#2dd4bf' },  // teal
      { bg: 'rgba(240,168,48,0.14)',  fg: '#f0a830' },  // amber
      { bg: 'rgba(226,107,245,0.14)', fg: '#e26bf5' },  // purple
      { bg: 'rgba(62,207,142,0.14)',  fg: '#3ecf8e' },  // green
      { bg: 'rgba(224,85,85,0.14)',   fg: '#e05555' },  // red
    ];
    function branchColor(branch) {
      const s = String(branch || '');
      let hash = 0;
      for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
      return BRANCH_PALETTE[hash % BRANCH_PALETTE.length];
    }

    function statusClass(s) {
      const map = { scheduled:'launch-status-scheduled', upcoming:'launch-status-upcoming',
                    delayed:'launch-status-delayed', 'in-progress':'launch-status-in-progress',
                    completed:'launch-status-completed', scrubbed:'launch-status-scrubbed' };
      return map[s] || 'launch-status-scheduled';
    }

    function statusLabel(s) {
      const map = { 'in-progress': 'In Progress' };
      if (map[s]) return map[s];
      s = String(s || '');
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function liveStatus(l) {
      if (l.status === 'completed' || l.status === 'scrubbed') return l.status;
      const t = l.date ? new Date(l.date).getTime() : NaN;
      if (!isNaN(t) && Date.now() >= t) return 'in-progress';
      return l.status || 'upcoming';
    }

    function timeRangeStr(dateIso) {
      if (!dateIso) return '';
      const start = new Date(dateIso);
      if (isNaN(start.getTime())) return '';
      const startTime = start.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      const tz = Intl.DateTimeFormat('en-US', { timeZoneName: 'short' }).formatToParts(start)
        .find(p => p.type === 'timeZoneName')?.value || '';
      return `${startTime}${tz ? ' ' + tz : ''}`;
    }

    function fullDateStr(dateIso) {
      if (!dateIso) return '';
      const d = new Date(dateIso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }

    function pad2(n) { return String(n).padStart(2, '0'); }

    function countdownStr(dateIso) {
      if (!dateIso) return null;
      const target = new Date(dateIso).getTime();
      if (isNaN(target)) return null;
      const diffMs = target - Date.now();
      const sign = diffMs >= 0 ? 'T-' : 'T+';
      const abs = Math.abs(diffMs);
      const totalHours = Math.floor(abs / 3600000);
      const mins = Math.floor((abs % 3600000) / 60000);
      const secs = Math.floor((abs % 60000) / 1000);
      return `${sign}${pad2(totalHours)}:${pad2(mins)}:${pad2(secs)}`;
    }

    function updateCountdowns() {
      document.querySelectorAll('[data-countdown]').forEach(el => {
        const str = countdownStr(el.dataset.countdown);
        if (str) el.textContent = str;
        if (str && str.startsWith('T+') && !el.classList.contains('launch-status-in-progress')) {
          el.classList.remove('launch-status-scheduled', 'launch-status-upcoming');
          el.classList.add('launch-status-in-progress');
        }
      });
    }
    setInterval(updateCountdowns, 1000);

    function showNotFound() {
      document.getElementById('launch-loading').style.display = 'none';
      document.getElementById('launch-notfound').style.display = 'block';
    }

    const id = new URLSearchParams(window.location.search).get('id');

    if (!id) {
      showNotFound();
    } else {
      fetch(`${SB_URL}/rest/v1/launches?id=eq.${encodeURIComponent(id)}&select=*`, {
        headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
      })
        .then(r => r.json())
        .then(rows => {
          const l = Array.isArray(rows) ? rows[0] : null;
          if (!l || !l.published) { showNotFound(); return; }
          renderLaunch(l);
        })
        .catch(err => {
          console.error('launch error:', err);
          showNotFound();
        });
    }

    function renderLaunch(l) {
      document.title = `${l.name || 'Launch'} — ISA`;

      const eff = liveStatus(l);
      const cd = (eff !== 'completed' && eff !== 'scrubbed') ? countdownStr(l.date) : null;

      document.getElementById('launch-detail-meta').innerHTML =
        `${cd
            ? `<span class="launch-status ${statusClass(eff)}" data-countdown="${escHtml(l.date)}">${cd}</span>`
            : `<span class="launch-status ${statusClass(eff)}">${escHtml(statusLabel(eff) || 'scheduled')}</span>`}
         ${l.mission_id ? `<span class="launch-mission-badge">${escHtml(String(l.mission_id))}</span>` : ''}
         ${l.launchshare ? `<span class="launch-launchshare-badge">Launchshare</span>` : ''}`;

      document.getElementById('launch-detail-title').textContent = l.name || 'Unnamed Launch';
      document.getElementById('launch-detail-datebig').textContent = fullDateStr(l.date);
      document.getElementById('launch-detail-time').textContent = timeRangeStr(l.date);

      document.getElementById('launch-detail-body').innerHTML = mdToHtml(l.description) || '<p>No further details yet.</p>';

      const hero = document.getElementById('launch-hero');
      const heroImage = l.image || 'https://images.unsplash.com/photo-1516849841032-87cbac4d88f7?q=80&w=1800&auto=format&fit=crop';
      document.getElementById('launch-hero-img').src = heroImage;
      hero.classList.add('has-image');

      const branchColorObj = l.branch ? branchColor(l.branch) : null;
      const manualTags = (l.tags && Array.isArray(l.tags)) ? l.tags : [];
      document.getElementById('launch-detail-tags').innerHTML =
        `${branchColorObj ? `<span class="branch-tag" style="background:${branchColorObj.bg};color:${branchColorObj.fg}">${escHtml(l.branch)}</span>` : ''}
         ${l.orbit ? `<span class="isa-tag">${escHtml(l.orbit)}</span>` : ''}
         ${manualTags.map(t => `<span class="isa-tag">${escHtml(String(t))}</span>`).join('')}`;

      if (l.launchshare) {
        document.getElementById('launch-ls-cta').style.display = 'inline-flex';
      }

      document.getElementById('launch-loading').style.display = 'none';
      document.getElementById('launch-detail').style.display = 'block';
    }
  </script>
</body>
</html>
