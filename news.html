<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News — ISA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css?v=8">
  <link rel="stylesheet" href="news.css">
  <link rel="icon" type="image/png" href="ISSSSSSSAAAA.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="markdown.js"></script>
  <style>
    /* Section labels */
    .news-section-label {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 64px 0 22px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted2);
    }
    .news-section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .news-section-label:first-child { margin-top: 0; }

    /* Big site news: bigger images */
    .news-card-lg .news-card-img { min-height: 260px; }
    .news-card-lg h3 { font-size: 1.35rem; line-height: 1.2; }

    /* Small Discord news */
    .news-compact-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .news-compact {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 3px solid var(--discord);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }
    .news-compact:hover {
      background: var(--panel2);
      border-color: var(--line2);
      border-left-color: var(--discord);
      transform: translateY(-1px);
    }
    .news-compact-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: var(--muted);
    }
    .news-compact-src {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #8f9bff;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }
    .news-compact h4 {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.1px;
    }
    .news-compact p {
      font-size: 0.78rem;
      line-height: 1.5;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    @media (max-width: 900px) { .news-compact-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .news-compact-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="page-hero">
    <div class="hero-media-slideshow" data-hero-media></div>
    <div class="page-hero-overlay"></div>
    <div class="container">
      <p class="eyebrow">NEWS</p>
      <h1>Updates &<br>Announcements.</h1>
      <p>Mission updates, community announcements, and engineering dispatches from across ISA's programs.</p>
    </div>
  </div>

  <section class="section-news">
    <div class="container">
      <div id="news-featured-wrap"></div>
      <div class="news-masonry" id="news-grid"></div>
      <div id="news-discord-wrap"></div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script>
    const SB_URL = 'https://fqvghuvmgswegirgitom.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxdmdodXZtZ3N3ZWdpcmdpdG9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTI4MTAsImV4cCI6MjA5NjY4ODgxMH0.7tKrak3ANnnhp4pISK2ythPdCt557vMACUhpQsqWn0s';

    const IMG_SIZES = ['tall', 'short'];
    const NEWS_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>';
    const DISCORD_ICON_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>';

    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    /* ------------------------------------------------------------------
       HOW WE TELL DISCORD NEWS FROM SITE NEWS
       Edit this function to match the column in your Supabase "news" table.
       Right now a post counts as Discord news if ANY of these is true:
         - source / origin / type contains "discord"
         - tag is "Discord"
         - it has a discord_id / discord_message_id / message_id / discord_url
       ------------------------------------------------------------------ */
    function isDiscordNews(n) {
      const src = String(n.source || n.origin || n.type || '').toLowerCase();
      if (src.includes('discord')) return true;
      if (String(n.tag || '').trim().toLowerCase() === 'discord') return true;
      return !!(n.discord_id || n.discord_message_id || n.message_id || n.discord_url);
    }

    function parseFlexDate(str) {
      if (!str) return null;
      const s = String(str).trim();
      let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
      m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
      if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
      const d = new Date(s);
      return isNaN(d.getTime()) ? null : d;
    }

    function formatNiceDate(str) {
      const d = parseFlexDate(str);
      if (!d) return escHtml(str);
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    async function loadNews() {
      const featuredWrap = document.getElementById('news-featured-wrap');
      const grid = document.getElementById('news-grid');
      const discordWrap = document.getElementById('news-discord-wrap');
      try {
        const r = await fetch(`${SB_URL}/rest/v1/news?order=id.desc`, {
          headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
        });
        const posts = await r.json();

        if (Array.isArray(posts)) {
          posts.sort((a, b) => {
            const da = parseFlexDate(a.date);
            const db = parseFlexDate(b.date);
            const ta_ = da ? da.getTime() : -Infinity;
            const tb_ = db ? db.getTime() : -Infinity;
            return tb_ - ta_;
          });
        }

        if (!Array.isArray(posts) || !posts.length) {
          featuredWrap.innerHTML = '';
          grid.innerHTML = '<p style="color:var(--muted,#aaa);padding:40px 0">No news yet.</p>';
          return;
        }

        const descHtml = n => {
          const d = mdToPlain(newsBodyWithoutTitle(n.title, n.body));
          return d ? `<p>${escHtml(d)}</p>` : '';
        };

        window._newsPosts = posts;
        const newIds = isaGetNewIds('news', posts.map(p => p.id));

        // split: big (made on the site) vs small (from Discord)
        const sitePosts = posts.filter(p => !isDiscordNews(p));
        const discordPosts = posts.filter(isDiscordNews);

        const [featured, ...rest] = sitePosts;

        // --- featured site post (big) ---
        featuredWrap.innerHTML = featured ? `
          <a class="news-featured reveal-target" href="news-post.html?id=${encodeURIComponent(featured.id)}">
            ${newIds.has(Number(featured.id)) ? '<span class="isa-new-badge">New</span>' : ''}
            <div class="news-featured-img${featured.image ? '' : ' no-image'}" style="${featured.image ? `background-image:url('${escHtml(featured.image)}')` : ''}">${featured.image ? '' : NEWS_ICON_SVG}</div>
            <div class="news-featured-body">
              <div class="news-meta">
                <span class="news-tag">${escHtml(featured.tag)}</span>
                <span class="news-date">${formatNiceDate(featured.date)}</span>
              </div>
              <h2>${mdInline(featured.title)}</h2>
              ${descHtml(featured)}
              <span class="news-read">Read full story →</span>
            </div>
          </a>` : '';

        // --- other site posts (big cards, full page each) ---
        grid.innerHTML = rest.map((n, i) => {
          const sizeClass = IMG_SIZES[i % IMG_SIZES.length];
          return `
          <a class="news-card news-card-lg reveal-target" href="news-post.html?id=${encodeURIComponent(n.id)}">
            ${newIds.has(Number(n.id)) ? '<span class="isa-new-badge">New</span>' : ''}
            <div class="news-card-img ${sizeClass}${n.image ? '' : ' no-image'}" style="${n.image ? `background-image:url('${escHtml(n.image)}')` : ''}">${n.image ? '' : NEWS_ICON_SVG}</div>
            <div class="news-card-body">
              <div class="news-meta">
                <span class="news-tag">${escHtml(n.tag)}</span>
                <span class="news-date">${formatNiceDate(n.date)}</span>
              </div>
              <h3>${mdInline(n.title)}</h3>
              ${descHtml(n)}
              <span class="news-read">Read more →</span>
            </div>
          </a>`;
        }).join('');

        // --- Discord posts (small, compact, no images) ---
        discordWrap.innerHTML = discordPosts.length ? `
          <div class="news-section-label"${sitePosts.length ? '' : ' style="margin-top:0"'}>From Discord</div>
          <div class="news-compact-grid">
            ${discordPosts.map(n => {
              const ext = /^https?:\/\//i.test(n.discord_url || '');
              const href = ext ? n.discord_url.trim() : 'news-post.html?id=' + encodeURIComponent(n.id);
              return `
              <a class="news-compact reveal-target" href="${escHtml(href)}"${ext ? ' target="_blank" rel="noopener"' : ''}>
                <div class="news-compact-meta">
                  <span class="news-compact-src">${DISCORD_ICON_SVG} Discord</span>
                  <span>${formatNiceDate(n.date)}</span>
                </div>
                <h4>${mdInline(n.title)}</h4>
                ${descHtml(n)}
              </a>`;
            }).join('')}
          </div>` : '';

      } catch(e) {
        featuredWrap.innerHTML = '';
        grid.innerHTML = '<p style="color:#e05555;padding:40px 0">Failed to load news.</p>';
        console.error('loadNews error:', e);
      }
    }

    loadNews();
  </script>
  <script src="shared.js?v=2"></script>
</body>
</html>
