<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News — ISA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css?v=6">
  <link rel="stylesheet" href="news.css">
  <link rel="icon" type="image/png" href="ISSSSSSSAAAA.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="markdown.js"></script>
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="page-hero">
    <div class="hero-media-slideshow" data-hero-media></div>
    <div class="page-hero-overlay"></div>
    <div class="container">
      <p class="eyebrow">NEWS</p>
      <h1>Updates &<br>Announcements.</h1>
      <p>Mission updates, community announcements, and engineering dispatches from across ISA's programs.</p>
    </div>
  </div>

  <section class="section-news">
    <div class="container">
      <div id="news-featured-wrap"></div>
      <div class="news-masonry" id="news-grid"></div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script>
    const SB_URL = 'https://fqvghuvmgswegirgitom.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxdmdodXZtZ3N3ZWdpcmdpdG9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTI4MTAsImV4cCI6MjA5NjY4ODgxMH0.7tKrak3ANnnhp4pISK2ythPdCt557vMACUhpQsqWn0s';

    // image height alternation for masonry variety — every card always
    // shows an image block (real photo, or a placeholder icon), just at
    // one of these two heights, so cards stay visually consistent.
    const IMG_SIZES = ['tall', 'short'];
    const NEWS_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>';

    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Dates in the DB can be typed inconsistently (ISO, "13 june 2026", "05/07/2026", "Jun 2, 2026"...).
    // parseFlexDate tries to make sense of whatever format was entered so posts can be sorted correctly.
    function parseFlexDate(str) {
      if (!str) return null;
      const s = String(str).trim();
      let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/); // ISO: YYYY-MM-DD
      if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
      m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/); // DD/MM/YYYY or DD.MM.YYYY
      if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
      const d = new Date(s); // fallback: "13 June 2026", "Jun 2, 2026", etc.
      return isNaN(d.getTime()) ? null : d;
    }

    // Always display dates the same way, regardless of how they were originally typed.
    function formatNiceDate(str) {
      const d = parseFlexDate(str);
      if (!d) return escHtml(str);
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    async function loadNews() {
      const featuredWrap = document.getElementById('news-featured-wrap');
      const grid = document.getElementById('news-grid');
      try {
        const r = await fetch(`${SB_URL}/rest/v1/news?order=id.desc`, {
          headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
        });
        const posts = await r.json();

        if (Array.isArray(posts)) {
          // Sort newest → oldest by the actual date, no matter what format it was typed in.
          posts.sort((a, b) => {
            const da = parseFlexDate(a.date);
            const db = parseFlexDate(b.date);
            const ta_ = da ? da.getTime() : -Infinity;
            const tb_ = db ? db.getTime() : -Infinity;
            return tb_ - ta_;
          });
        }

        if (!Array.isArray(posts) || !posts.length) {
          featuredWrap.innerHTML = '';
          grid.innerHTML = '<p style="color:var(--muted,#aaa);padding:40px 0">No news yet.</p>';
          return;
        }

        const [featured, ...rest] = posts;
        window._newsPosts = posts;

        const newIds = isaGetNewIds('news', posts.map(p => p.id));

        // featured card
        featuredWrap.innerHTML = `
          <a class="news-featured reveal-target" href="news-post.html?id=${encodeURIComponent(featured.id)}">
            ${newIds.has(Number(featured.id)) ? '<span class="isa-new-badge">New</span>' : ''}
            <div class="news-featured-img${featured.image ? '' : ' no-image'}" style="${featured.image ? `background-image:url('${escHtml(featured.image)}')` : ''}">${featured.image ? '' : NEWS_ICON_SVG}</div>
            <div class="news-featured-body">
              <div class="news-meta">
                <span class="news-tag">${escHtml(featured.tag)}</span>
                <span class="news-date">${formatNiceDate(featured.date)}</span>
              </div>
              <h2>${escHtml(featured.title)}</h2>
              <p>${escHtml(mdToPlain(featured.body))}</p>
              <span class="news-read">Read full story →</span>
            </div>
          </a>`;

        // masonry cards
        grid.innerHTML = rest.map((n, i) => {
          const sizeClass = IMG_SIZES[i % IMG_SIZES.length];
          return `
          <a class="news-card reveal-target" href="news-post.html?id=${encodeURIComponent(n.id)}">
            ${newIds.has(Number(n.id)) ? '<span class="isa-new-badge">New</span>' : ''}
            <div class="news-card-img ${sizeClass}${n.image ? '' : ' no-image'}" style="${n.image ? `background-image:url('${escHtml(n.image)}')` : ''}">${n.image ? '' : NEWS_ICON_SVG}</div>
            <div class="news-card-body">
              <div class="news-meta">
                <span class="news-tag">${escHtml(n.tag)}</span>
                <span class="news-date">${formatNiceDate(n.date)}</span>
              </div>
              <h3>${escHtml(n.title)}</h3>
              <p>${escHtml(mdToPlain(n.body))}</p>
              <span class="news-read">Read more →</span>
            </div>
          </a>`;
        }).join('');

      } catch(e) {
        featuredWrap.innerHTML = '';
        grid.innerHTML = '<p style="color:#e05555;padding:40px 0">Failed to load news.</p>';
        console.error('loadNews error:', e);
      }
    }

    loadNews();
  </script>
  <script src="shared.js?v=2"></script>
</body>
</html>
