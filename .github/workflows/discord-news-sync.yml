name: Discord News Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync endpoint
        run: |
          curl -sf -X POST "${{ secrets.NEWS_SYNC_URL }}" \
            -H "Authorization: Bearer ${{ secrets.NEWS_SYNC_SECRET }}"
