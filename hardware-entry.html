<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardware — ISA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css?v=6">
  <link rel="stylesheet" href="launches.css?v=2">
  <link rel="stylesheet" href="launch.css?v=1">
  <link rel="stylesheet" href="hardware.css">
  <link rel="stylesheet" href="news.css">
  <link rel="stylesheet" href="project.css">
  <link rel="icon" type="image/png" href="ISSSSSSSAAAA.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="markdown.js"></script>
</head>
<body>
  <div id="nav-placeholder"></div>
  <div class="launch-state" id="he-loading"><div class="container"><div class="launch-spinner"></div><p>Loading hardware…</p></div></div>
  <div class="launch-state" id="he-missing" style="display:none"><div class="container">
    <p class="eyebrow">HARDWARE</p><h1>Entry not found.</h1><p>It may have been removed, or the link is incorrect.</p>
    <a href="hardware.html" class="btn-outline">← Back to hardware</a>
  </div></div>
  <div id="he-main" style="display:none">
    <div class="launch-hero" id="he-hero">
      <img class="launch-hero-bg-img" id="he-img" alt="">
      <div class="launch-hero-overlay"></div>
      <div class="container launch-hero-inner">
        <div class="mission-meta" id="he-meta"></div>
        <h1 id="he-title"></h1>
      </div>
    </div>
    <section class="section-launch-detail">
      <div class="container">
        <div class="launch-detail-main">
          <div class="news-body-text" id="he-body"></div>
          <p style="margin-top:24px"><a class="btn-outline" id="he-src" target="_blank" rel="noopener noreferrer" style="display:none">Source →</a>
          <a class="btn-outline" id="he-back" href="hardware.html">← Back</a></p>
        </div>
      </div>
    </section>
  </div>

  <div id="footer-placeholder"></div>

  <script src="shared.js?v=3"></script>
  <script>
    const SB_URL = 'https://fqvghuvmgswegirgitom.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxdmdodXZtZ3N3ZWdpcmdpdG9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTI4MTAsImV4cCI6MjA5NjY4ODgxMH0.7tKrak3ANnnhp4pISK2ythPdCt557vMACUhpQsqWn0s';
    const ST = { active:'status-active', scrapped:'status-scrapped', destroyed:'status-destroyed', expended:'status-expended', retired:'status-retired' };
    const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
    const $ = id => document.getElementById(id);
    function missing() { $('he-loading').style.display = 'none'; $('he-missing').style.display = 'block'; }
    function fmtDate(d) {
      const t = new Date(/^\d{4}-\d{2}-\d{2}$/.test(d || '') ? d + 'T00:00:00Z' : d);
      return isNaN(t) ? esc(d) : t.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric', timeZone:'UTC' });
    }
    const id = new URLSearchParams(location.search).get('id');
    if (!id) missing(); else
    fetch(`${SB_URL}/rest/v1/site13_updates?id=eq.${encodeURIComponent(id)}&select=*`, { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } })
      .then(r => r.json()).then(rows => {
        const u = Array.isArray(rows) ? rows[0] : null;
        if (!u) return missing();
        document.title = `${mdToPlain(u.title) || 'Hardware'} — ISA`;
        const img = safeUrl(u.image);
        if (img) { $('he-img').src = img; $('he-hero').classList.add('has-image'); }
        $('he-meta').innerHTML = `${u.tag ? `<span class="mission-status ${ST[String(u.tag).toLowerCase()] || ''}">${esc(u.tag)}</span>` : ''}${u.date ? `<span class="mission-division">${fmtDate(u.date)}</span>` : ''}${u.flight ? `<span class="mission-tags meta-tags-inline"><span class="isa-tag">${esc(u.flight)}</span></span>` : ''}`;
        $('he-title').innerHTML = mdInline(u.title);
        const html = mdToHtml(u.body || '');
        $('he-body').innerHTML = (window.DOMPurify ? DOMPurify.sanitize(html) : esc(u.body)) || '<p>No further details yet.</p>';
        const link = safeUrl(u.link);
        if (link) { $('he-src').href = link; $('he-src').style.display = ''; }
        if (u.project_id) $('he-back').href = `project.html?id=${encodeURIComponent(u.project_id)}`;
        $('he-loading').style.display = 'none'; $('he-main').style.display = 'block';
      }).catch(missing);
  </script>
</body>
</html>
